/* =======================================================================
   PERSISTENCE
   ======================================================================= */
const STORAGE_KEY = "trip_dossier_checked_v1";
let stamps = {};
try {
  const raw = localStorage.getItem(STORAGE_KEY);
  stamps = raw ? JSON.parse(raw) : {};
} catch (e) { stamps = {}; }

function saveStamps() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stamps)); } catch (e) { /* ignore */ }
}

function slug(dayId, name) {
  return dayId + "-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

/* =======================================================================
   RENDER
   ======================================================================= */
function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderNotice(note) {
  const cls = note.type === "ok" ? "notice ok" : "notice";
  return `<div class="${cls}"><span class="notice-label">${esc(note.label)}</span>${note.text}</div>`;
}

function renderStop(day, stop, dayIdx, stopIdx) {
  const id = slug(day.id, stop.name);
  const stamped = !!stamps[id];
  let tagHtml = "";
  if (stop.badge) {
    const cls = stop.badge.type === "warn" ? "tag warn" : "tag";
    tagHtml = `<span class="${cls}">${esc(stop.badge.text)}</span>`;
  }
  let bookingHtml = "";
  if (stop.booking) {
    bookingHtml = `<div class="inline-note"><span class="k">Booking Note</span>${stop.booking.label} <a href="${stop.booking.url}" target="_blank" rel="noopener">${stop.booking.url}</a></div>`;
  }
  return `
  <div class="stop" data-id="${id}">
    <div class="time-badge">${esc(stop.time)}</div>
    <div class="card" id="${id}">
      <div class="card-head" data-toggle="${id}">
        <div class="card-titles">
          <p class="card-name">${esc(stop.name)} ${tagHtml}</p>
          <p class="card-meta"><a class="meta-map" href="${stop.mapsUrl}" target="_blank" rel="noopener">📍 Google Maps</a><span>${stop.distance}</span></p>
        </div>
        <button class="stamp-btn${stamped ? " stamped" : ""}" data-stamp="${id}" title="Mark visited" aria-label="Mark visited"></button>
        <span class="card-chevron">&#9656;</span>
      </div>
      <div class="card-body">
        <div class="field-row">
          <div class="field"><span class="k">Address</span><span class="v">${esc(stop.address)}</span></div>
          <div class="field"><span class="k">Distance from Previous Stop</span><span class="v">${stop.distance}</span></div>
          <div class="field"><span class="k">Recommended Time</span><span class="v">${stop.recTime}</span></div>
        </div>
        <a class="map-link" href="${stop.mapsUrl}" target="_blank" rel="noopener">&#128205; View on Google Maps</a>
        <p class="section-label">History</p><p class="prose">${stop.history}</p>
        <p class="section-label">Interesting Fact</p><p class="prose">${stop.fact}</p>
        <p class="section-label">Photo Tip</p><p class="prose">${stop.photoTip}</p>
        ${bookingHtml}
      </div>
    </div>
  </div>`;
}

function renderMeal(day, meal, kind) {
  const id = slug(day.id, kind + "-" + meal.name);
  const icon = kind === "lunch" ? "Lunch" : "Dinner";
  return `
  <div class="stop" data-id="${id}">
    <div class="time-badge">${icon}</div>
    <div class="card" id="${id}">
      <div class="card-head" data-toggle="${id}">
        <div class="card-titles">
          <p class="card-name">${esc(meal.name)}</p>
          <p class="card-meta"><a class="meta-map" href="${meal.mapsUrl}" target="_blank" rel="noopener">📍 Google Maps</a><span>${esc(meal.address)}</span></p>
        </div>
        <span class="card-chevron">&#9656;</span>
      </div>
      <div class="card-body">
        <div class="field-row">
          <div class="field"><span class="k">Address</span><span class="v">${esc(meal.address)}</span></div>
        </div>
        <a class="map-link" href="${meal.mapsUrl}" target="_blank" rel="noopener">&#128205; View on Google Maps</a>
        <p class="section-label">About</p><p class="prose">${meal.desc}</p>
        ${meal.mustTry ? `<p class="section-label">Must Try</p><p class="prose">${meal.mustTry}</p>` : ""}
      </div>
    </div>
  </div>`;
}

function renderBackups(day) {
  if (!day.backups || !day.backups.length) return "";
  const items = day.backups.map(b => `
    <div class="backup-item">
      <span class="bname">${esc(b.name)}</span> (${esc(b.address)}) —
      <a href="${b.mapsUrl}" target="_blank" rel="noopener">Google Maps</a>.
      ${b.note}
    </div>`).join("");
  return `
  <div class="backups-wrap">
    <button class="backups-toggle" data-role="backups-toggle">
      <span>🗂 Backup spots — if you have extra time (${day.backups.length})</span>
      <span class="arrow">&#9656;</span>
    </button>
    <div class="backups-body">${items}</div>
  </div>`;
}

function renderDay(day, dayIdx) {
  let html = "";

  html += `<div class="day-header">
    <div class="day-header-top"><span>${esc(day.dayLabel)} &middot; ${esc(day.date)}</span><span>${esc(day.tagline)}</span></div>
    <h2>${esc(day.city)}</h2>
    <button class="summary-toggle" data-role="summary-toggle"><span class="arrow">&#9656;</span> Day summary</button>
    <div class="day-info">
      <p>${day.intro}</p>`;
  if (day.hotel) html += `<p class="stat-line"><span class="label-inline">Hotel &mdash; </span>${esc(day.hotel.address)} &mdash; <a href="${day.hotel.url}" target="_blank" rel="noopener">Map</a></p>`;
  if (day.walking) html += `<p class="stat-line">Walking Distance: ${day.walking}</p>`;
  if (day.notes) day.notes.forEach(n => { html += renderNotice(n); });
  if (day.personalNotes) day.personalNotes.forEach(p => { html += `<div class="notice ok">${p}</div>`; });
  html += `</div></div>`;

  if (day.transfer) html += `<div class="dispatch"><p class="dispatch-label">Dispatch</p><p>${day.transfer}</p></div>`;

  html += `<div class="divider"><span>Sightseeing Stops</span></div>`;
  html += `<div class="timeline">${day.stops.map((s, i) => renderStop(day, s, dayIdx, i)).join("")}</div>`;

  if (day.lunch || day.dinner) {
    html += `<div class="divider"><span>Meals</span></div>`;
    html += `<div class="timeline">`;
    if (day.lunch) html += renderMeal(day, day.lunch, "lunch");
    if (day.dinner) html += renderMeal(day, day.dinner, "dinner");
    html += `</div>`;
  }

  if (day.backups && day.backups.length) {
    html += `<div class="divider"><span>In Case You Have Time</span></div>`;
    html += renderBackups(day);
  }

  if (day.airport) {
    html += `<div class="divider"><span>Getting to the Airport</span></div>`;
    html += `<div class="dispatch">
      <p class="dispatch-label">Dispatch</p>
      <p><b>${esc(day.airport.name)}</b> &mdash; ${esc(day.airport.address)} &mdash; <a href="${day.airport.mapsUrl}" target="_blank" rel="noopener">Open in Google Maps</a></p>
      <div class="dispatch-steps">${day.airport.steps.map(s => `<div>${esc(s)}</div>`).join("")}</div>
    </div>`;
  }

  if (day.closing) html += `<p class="closing-note">${day.closing}</p>`;

  return html;
}

function countStops(day) { return day.stops.length; }
function countChecked(day) { return day.stops.filter(s => stamps[slug(day.id, s.name)]).length; }

function renderRoute(activeCity) {
  const positions = [40, 226, 412, 598];
  let svg = `<svg viewBox="0 0 640 60" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<line x1="${positions[0]}" y1="30" x2="${positions[3]}" y2="30" stroke="rgba(239,230,210,0.35)" stroke-width="1" stroke-dasharray="2 4"/>`;
  CITY_ROUTE.forEach((c, i) => {
    const activeCls = c === activeCity ? "route-dot route-dot-active" : "route-dot";
    svg += `<circle cx="${positions[i]}" cy="30" r="5" class="${activeCls}"/>`;
    svg += `<text x="${positions[i]}" y="16" text-anchor="middle" class="route-city">${esc(c)}</text>`;
  });
  svg += `</svg>`;
  document.getElementById("routeLine").innerHTML = svg;
}

function buildDayRail() {
  const rail = document.getElementById("dayRail");
  TRIP.forEach((day, i) => {
    const btn = document.createElement("button");
    btn.className = "day-tab" + (i === 0 ? " active" : "");
    btn.dataset.day = i;
    btn.innerHTML = `<span class="num">${esc(day.dayLabel)}</span><div class="city">${esc(day.city)}</div><div class="date">${esc(day.dateShort)}</div><div class="tab-count" data-role="tab-count">${countChecked(day)}/${countStops(day)}</div>`;
    btn.addEventListener("click", () => switchDay(i));
    rail.appendChild(btn);
  });
}

function buildPanels() {
  const main = document.getElementById("mainPanel");
  let html = "";
  TRIP.forEach((day, i) => {
    html += `<section class="day-panel${i === 0 ? " active" : ""}" id="day-${i}" data-day="${i}">${renderDay(day, i)}</section>`;
  });
  main.innerHTML = html;
}

function updateProgress() {
  let total = 0, done = 0;
  TRIP.forEach(day => { total += countStops(day); done += countChecked(day); });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("progressText").textContent = `${done} / ${total} stamped`;
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressNote2").textContent = `${done} / ${total} stamped`;
  document.querySelectorAll(".day-tab").forEach((tab, i) => {
    const day = TRIP[i];
    const el = tab.querySelector('[data-role="tab-count"]');
    if (el) el.textContent = `${countChecked(day)}/${countStops(day)}`;
  });
}

function switchDay(idx) {
  document.querySelectorAll(".day-panel").forEach(p => p.classList.toggle("active", p.dataset.day == idx));
  document.querySelectorAll(".day-tab").forEach(t => t.classList.toggle("active", t.dataset.day == idx));
  renderRoute(TRIP[idx].city);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function init() {
  buildDayRail();
  buildPanels();
  updateProgress();
  renderRoute(TRIP[0].city);

  document.getElementById("mainPanel").addEventListener("click", (e) => {
    const stampBtn = e.target.closest("[data-stamp]");
    if (stampBtn) {
      e.stopPropagation();
      const id = stampBtn.dataset.stamp;
      stamps[id] = !stamps[id];
      stampBtn.classList.toggle("stamped", !!stamps[id]);
      saveStamps();
      updateProgress();
      return;
    }
    const summaryToggle = e.target.closest('[data-role="summary-toggle"]');
    if (summaryToggle) {
      summaryToggle.classList.toggle("open");
      summaryToggle.nextElementSibling.classList.toggle("open");
      return;
    }
    const backupsToggle = e.target.closest('[data-role="backups-toggle"]');
    if (backupsToggle) {
      backupsToggle.classList.toggle("open");
      backupsToggle.nextElementSibling.classList.toggle("open");
      return;
    }
    if (e.target.closest("a")) return;
    const head = e.target.closest("[data-toggle]");
    if (head) {
      document.getElementById(head.dataset.toggle).classList.toggle("expanded");
    }
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("Reset all stamped spots? This can't be undone.")) return;
    stamps = {};
    saveStamps();
    document.querySelectorAll(".stamp-btn").forEach(b => b.classList.remove("stamped"));
    updateProgress();
  });
}

init();
</script>
</body>
</html>
