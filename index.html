<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paris · Luxembourg · Brussels · Bruges — Trip Dossier</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧳</text></svg>">
<style>
/* ============ TOKENS ============ */
:root{
  --paper:#EFE6D2;
  --paper-dark:#E4D7B7;
  --paper-darker:#D9C99E;
  --ink:#241F16;
  --ink-soft:#5C5340;
  --ink-faint:#8C8267;
  --navy:#1D3557;
  --navy-deep:#122239;
  --brass:#A9812E;
  --brass-light:#C9A857;
  --oxblood:#7A2E2E;
  --oxblood-light:#9C4444;
  --ok-bg:rgba(90,110,70,0.14);
  --ok-ink:#4C5E36;
  --line:rgba(36,31,22,0.16);
  --line-strong:rgba(36,31,22,0.3);
  --shadow:0 1px 2px rgba(36,31,22,0.08), 0 8px 24px -12px rgba(36,31,22,0.25);
  --radius:2px;
  --font-display:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-body:Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-mono:ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
}
a{color:var(--navy);}
button{font-family:inherit;}

body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(36,31,22,0.035) 1px, transparent 1px);
  background-size:3px 3px;
  opacity:0.6;
}

/* ============ HERO ============ */
.hero{
  position:relative;
  background:linear-gradient(180deg, var(--navy-deep) 0%, var(--navy) 100%);
  color:var(--paper);
  padding:56px 24px 30px;
  text-align:center;
  border-bottom:6px solid var(--brass);
  overflow:hidden;
}
.hero::after{
  content:"";
  position:absolute; left:0; right:0; bottom:-6px; height:6px;
  background:repeating-linear-gradient(90deg, var(--navy-deep) 0 6px, transparent 6px 12px);
  opacity:0.5;
}
.hero-eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.28em;
  text-transform:uppercase;
  color:var(--brass-light);
  margin:0 0 14px;
}
.hero h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(2rem, 5.5vw, 3.6rem);
  letter-spacing:0.01em;
  margin:0 0 10px;
}
.hero-route{
  font-family:var(--font-mono);
  font-size:13px;
  letter-spacing:0.05em;
  color:rgba(239,230,210,0.75);
  margin:0 0 24px;
}
.route-line{ max-width:640px; margin:0 auto; }
.route-line svg{width:100%; height:auto; display:block;}
.route-city{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.06em; fill:rgba(239,230,210,0.85); }
.route-dot{fill:var(--brass-light);}
.route-dot-active{fill:var(--oxblood-light);}

.hero-progress{ max-width:340px; margin:24px auto 0; }
.hero-progress-label{
  display:flex; justify-content:space-between;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.05em;
  color:rgba(239,230,210,0.7); margin-bottom:6px;
}
.hero-progress-track{
  height:6px; border-radius:3px;
  background:rgba(239,230,210,0.15);
  overflow:hidden;
}
.hero-progress-fill{ height:100%; background:var(--brass-light); width:0%; transition:width .35s ease; }
.reset-link{
  margin-top:14px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.04em;
  color:rgba(239,230,210,0.55); text-decoration:underline; cursor:pointer; background:none; border:none;
}
.reset-link:hover{ color:var(--paper); }

/* ============ LAYOUT ============ */
.app{
  position:relative; z-index:1;
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  max-width:1180px;
  margin:0 auto;
  min-height:60vh;
}
@media (max-width: 860px){ .app{grid-template-columns:minmax(0,1fr);} }
.day-rail, .main{min-width:0;}

.day-rail{ padding:28px 0 40px 24px; border-right:1px solid var(--line); }
@media (max-width: 860px){
  .day-rail{
    border-right:none; border-bottom:1px solid var(--line);
    padding:16px 16px 12px;
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    display:flex; gap:10px; overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
}
.progress-note{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
  letter-spacing:0.04em; margin:0 0 18px; padding-right:16px;
}
@media (max-width: 860px){ .progress-note{display:none;} }

.day-tab{
  display:block; width:100%; text-align:left;
  background:none; border:none; border-left:3px solid transparent;
  padding:10px 16px 10px 14px; cursor:pointer; color:var(--ink-soft);
  transition:border-color .15s ease, color .15s ease, background .15s ease;
}
.day-tab:hover{background:rgba(169,129,46,0.08);}
.day-tab.active{ border-left-color:var(--oxblood); background:rgba(169,129,46,0.12); color:var(--ink); }
.day-tab .num{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em; color:var(--brass); }
.day-tab.active .num{color:var(--oxblood);}
.day-tab .city{ font-family:var(--font-display); font-weight:600; font-size:16px; margin:2px 0 1px; }
.day-tab .date{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }
.day-tab .tab-count{ font-family:var(--font-mono); font-size:10px; color:var(--brass); margin-top:3px; }
@media (max-width: 860px){
  .day-tab{ flex:0 0 auto; width:auto; white-space:nowrap; border-left:none; border-bottom:3px solid transparent; padding:6px 10px; }
  .day-tab.active{border-bottom-color:var(--oxblood);}
  .day-tab .city{font-size:13px; margin:0;}
  .day-tab .date{display:none;}
  .day-tab .tab-count{margin-top:1px;}
}

/* ============ MAIN PANEL ============ */
.main{padding:32px 28px 80px;}
@media (max-width: 860px){ .main{padding:20px 16px 60px;} }
.day-panel{display:none;}
.day-panel.active{display:block; animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ticket-stub day header */
.day-header{
  position:relative;
  background:var(--paper-dark);
  border:1px solid var(--line-strong);
  border-radius:var(--radius);
  padding:20px 24px 20px;
  margin-bottom:24px;
}
.day-header::before, .day-header::after{
  content:""; position:absolute; top:50%; width:22px; height:22px;
  background:var(--paper); border-radius:50%; transform:translateY(-50%);
  border:1px solid var(--line-strong);
}
.day-header::before{left:-12px;}
.day-header::after{right:-12px;}
@media (max-width: 640px){ .day-header::before, .day-header::after{display:none;} }
.day-header-top{
  display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--brass); margin-bottom:6px;
}
.day-header h2{
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(1.6rem, 3.6vw, 2.2rem); margin:0 0 4px; color:var(--navy);
}
.day-header .tagline{ font-size:15px; color:var(--ink-soft); font-style:italic; margin:0; }

.summary-toggle{
  display:flex; align-items:center; gap:6px;
  width:100%; text-align:left;
  background:none; border:none;
  border-top:1px dashed var(--line-strong);
  margin-top:16px; padding-top:12px;
  cursor:pointer;
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--oxblood);
}
.summary-toggle .arrow{ transition:transform .2s ease; font-size:10px; }
.summary-toggle.open .arrow{ transform:rotate(90deg); }
.day-info{ display:none; padding-top:14px; }
.day-info.open{ display:block; }
.day-info p{ margin:0 0 10px; font-size:14.5px; color:var(--ink-soft); }
.day-info .stat-line{ font-family:var(--font-mono); font-size:12.5px; color:var(--navy); }
.day-info .label-inline{font-weight:600;}

.notice{
  background:rgba(122,46,46,0.07); border-left:3px solid var(--oxblood);
  padding:10px 14px; margin:12px 0; font-size:13.5px; color:var(--ink);
}
.notice.ok{ background:var(--ok-bg); border-left-color:var(--ok-ink); }
.notice .notice-label{
  font-family:var(--font-mono); font-weight:600; font-size:10.5px; letter-spacing:0.06em;
  text-transform:uppercase; color:var(--oxblood); display:block; margin-bottom:3px;
}
.notice.ok .notice-label{ color:var(--ok-ink); }

/* dispatch card (transfers / travel days) */
.dispatch{
  background:repeating-linear-gradient(135deg, var(--paper-dark), var(--paper-dark) 10px, var(--paper-darker) 10px, var(--paper-darker) 11px);
  border:1px dashed var(--line-strong); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:20px; font-size:14px;
}
.dispatch .dispatch-label{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--oxblood); margin:0 0 6px;
}
.dispatch p{margin:0 0 4px; color:var(--ink-soft);}
.dispatch a{color:var(--navy);}
.dispatch .dispatch-steps div{ margin:4px 0; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); }

/* chapter divider */
.divider{ position:relative; text-align:center; margin:26px 0 18px; }
.divider::before{ content:""; position:absolute; left:0; right:0; top:50%; border-top:1px dashed var(--line-strong); }
.divider span{
  position:relative; background:var(--paper); padding:0 14px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--oxblood);
}

/* ============ TIMELINE ============ */
.timeline{ position:relative; padding-left:78px; }
.timeline::before{ content:""; position:absolute; left:56px; top:6px; bottom:6px; width:1px; background:var(--line-strong); }
@media (max-width: 560px){ .timeline{padding-left:0;} .timeline::before{display:none;} }

.stop{ position:relative; margin-bottom:14px; }
.time-badge{
  position:absolute; left:-78px; top:14px; width:70px; text-align:right;
  font-family:var(--font-mono); font-size:12px; color:var(--navy); font-weight:500;
}
.stop .card{position:relative;}
.stop .card::before{
  content:""; position:absolute; left:-22px; top:22px; width:9px; height:9px; border-radius:50%;
  background:var(--paper); border:2px solid var(--brass); z-index:2;
}
@media (max-width: 560px){
  .time-badge{position:static; text-align:left; margin-bottom:4px; width:auto;}
}

.card{
  background:var(--paper-dark); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); overflow:hidden;
}
.card-head{ display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; user-select:none; }
.card-head:hover{background:rgba(169,129,46,0.08);}
.card-titles{flex:1; min-width:0;}
.card-name{ font-family:var(--font-display); font-weight:600; font-size:17px; margin:0 0 2px; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card-meta{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.card-meta a.meta-map{ color:var(--navy); font-weight:600; text-decoration:none; border-bottom:1px solid var(--navy); white-space:nowrap; }
.card-meta a.meta-map:hover{ color:var(--oxblood); border-color:var(--oxblood); }

.tag{
  font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:0.03em;
  padding:2px 7px; border-radius:3px; background:var(--ok-bg); color:var(--ok-ink); white-space:nowrap;
}
.tag.warn{ background:rgba(169,129,46,0.18); color:var(--brass); }

.card-chevron{ font-size:13px; color:var(--brass); transition:transform .2s ease; flex:0 0 auto; }
.card.expanded .card-chevron{transform:rotate(90deg);}

.stamp-btn{
  flex:0 0 auto; width:34px; height:34px; border-radius:50%;
  border:1.5px dashed var(--brass); background:transparent; cursor:pointer; position:relative;
  transition:transform .15s ease;
}
.stamp-btn:hover{transform:scale(1.06);}
.stamp-btn.stamped{
  border-style:solid; border-color:var(--oxblood);
  background:radial-gradient(circle at 35% 30%, rgba(122,46,46,0.15), transparent 60%), var(--paper);
  animation:stamp-in .35s cubic-bezier(.4,1.6,.5,1);
  transform:rotate(-6deg);
}
.stamp-btn.stamped::before{
  content:"✓"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--oxblood); font-size:15px; font-weight:700;
}
@keyframes stamp-in{ 0%{transform:scale(1.5) rotate(-14deg); opacity:0;} 60%{transform:scale(0.92) rotate(4deg); opacity:1;} 100%{transform:scale(1) rotate(-6deg);} }

.card-body{ display:none; padding:4px 18px 18px; border-top:1px dashed var(--line); }
.card.expanded .card-body{display:block;}

.field-row{ display:flex; flex-wrap:wrap; gap:8px 22px; margin:14px 0 6px; }
.field{font-size:13.5px;}
.field .k{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--brass); display:block; margin-bottom:2px; }
.field .v{color:var(--ink);}
.map-link{
  display:inline-flex; align-items:center; gap:5px; margin-top:10px;
  font-family:var(--font-mono); font-size:11.5px; color:var(--navy); text-decoration:none;
  border-bottom:1px solid var(--navy); padding-bottom:1px;
}
.map-link:hover{color:var(--oxblood); border-color:var(--oxblood);}

.section-label{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--brass); margin:16px 0 4px; }
.prose{ font-size:14.5px; color:var(--ink-soft); margin:0 0 4px; }
.inline-note{ background:rgba(169,129,46,0.09); border-left:3px solid var(--brass); padding:8px 12px; margin:10px 0; font-size:13px; }
.inline-note .k{ font-family:var(--font-mono); font-weight:600; font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--brass); margin-right:4px; display:block; margin-bottom:3px;}
.inline-note a{color:var(--navy); font-weight:600; word-break:break-all;}

/* backups collapsible */
.backups-wrap{ border:1px dashed var(--line-strong); border-radius:var(--radius); background:var(--paper-dark); margin-bottom:20px; overflow:hidden; }
.backups-toggle{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  background:none; border:none; padding:12px 16px; cursor:pointer;
  font-family:var(--font-mono); font-size:12px; letter-spacing:0.05em; text-transform:uppercase; color:var(--oxblood);
}
.backups-toggle .arrow{ margin-left:auto; transition:transform .2s ease; font-size:10px; }
.backups-toggle.open .arrow{ transform:rotate(90deg); }
.backups-body{ display:none; padding:0 16px 14px; }
.backups-body.open{ display:block; }
.backup-item{ padding:10px 0; border-top:1px dashed var(--line); font-size:13.5px; color:var(--ink-soft); line-height:1.5; }
.backup-item:first-child{border-top:none;}
.backup-item .bname{ font-weight:700; color:var(--ink); font-family:var(--font-body); }
.backup-item a{ color:var(--navy); font-weight:600; text-decoration:none; border-bottom:1px solid currentColor; }

.closing-note{ font-size:13.5px; font-style:italic; color:var(--ink-faint); margin:20px 0 6px; padding-top:14px; border-top:1px dashed var(--line-strong); }

footer{ text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); padding:30px 16px 50px; letter-spacing:0.04em; }
</style>
</head>
<body>

<div class="hero">
  <p class="hero-eyebrow">A Four-Capital Autumn Circuit</p>
  <h1>Paris · Luxembourg · Brussels · Bruges</h1>
  <p class="hero-route">Oct 8 &ndash; Oct 15, 2026 &middot; 8 Days &middot; 4 Cities</p>
  <div class="route-line" id="routeLine"></div>
  <div class="hero-progress">
    <div class="hero-progress-label"><span id="progressText">0 / 0 stamped</span><span id="progressPct">0%</span></div>
    <div class="hero-progress-track"><div class="hero-progress-fill" id="progressFill"></div></div>
  </div>
  <button class="reset-link" id="resetBtn" type="button">Reset all stamps</button>
</div>

<div class="app">
  <nav class="day-rail" id="dayRail">
    <p class="progress-note" id="progressNote2">0 / 0 stamped</p>
  </nav>
  <main class="main" id="mainPanel"></main>
</div>

<footer>Compiled for a fast walker who doesn't like to miss anything &middot; Paris, October 2026</footer>

<script>

   DATA
   ======================================================================= */
const CITY_ROUTE = ["Paris", "Luxembourg", "Brussels", "Bruges"];

function gmaps(lat, lng, pid) {
  return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}&query_place_id=${pid}`;
}
function gmapsAddr(addr) {
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`;
}

const TRIP = [
{
  id: "d1", city: "Paris", dayLabel: "Day 01", dateShort: "Oct 8",

  ],
  personalNotes: [

  stops: [
    { time: "3:00pm", name: "Porte Saint-Denis", address: "Boulevard Saint-Denis, 75010 Paris",

      distance: "5-minute walk from the hotel", recTime: "10 minutes",
      history: `Built in 1672 on the orders of Louis XIV to commemorate his military victories along the Rhine and in the Franche-Comté campaign, designed by François Blondel and modeled directly on Roman triumphal arches like the Arch of Titus. It replaced a medieval city gate that once marked the northern edge of Paris, back when the boulevards here traced the line of the old city walls rather than being grand avenues in their own right. Blondel was also the founding director of the Académie Royale d'Architecture, and this arch was in many ways his manifesto for what French classical architecture should look like.`,

    { time: "3:15pm", name: "Porte Saint-Martin", address: "Boulevard Saint-Martin, 75010 Paris",
      mapsUrl: gmaps(48.868507, 2.3629866, "ChIJ3c0rGwxu5kcRYl8YdZj1kPk"),

      fact: `The reliefs on the arch depict the capture of Besançon and the defeat of German, Spanish, and Dutch forces in the Franco-Dutch War, carved by four different sculptors working simultaneously to meet the king's deadline.`,

    { time: "3:45pm", name: "Arc de Triomphe", address: "Place Charles de Gaulle, 75008 Paris",
      mapsUrl: gmaps(48.8737917, 2.2950275, "ChIJjx37cOxv5kcRPWQuEW5ntdk"),
      distance: "Metro Strasbourg–Saint-Denis → Charles de Gaulle–Étoile (~25 min, one transfer)", recTime: "15 minutes (exterior)",
      history: `Commissioned by Napoleon in 1806 to honor his armies after the victory at Austerlitz, it wasn't completed until 1836, under Louis-Philippe, long after Napoleon's fall from power and death in exile — his body did eventually pass beneath it, though, during the 1840 procession that returned his remains to Les Invalides. It's since become the site of the Tomb of the Unknown Soldier, added in 1921, whose flame has been rekindled every evening at 6:30pm without interruption since 1923, even during the Nazi occupation of Paris.`,
      fact: `Twelve avenues radiate from the arch in a star pattern, which is why the square was originally named Place de l'Étoile — the name survives informally even after the official 1970 renaming for de Gaulle.`,
      photoTip: `Use the pedestrian underpass (never cross the traffic circle on foot) and shoot from the center island at the top of the Champs-Élysées.`,
      booking: { label: "Terrace-climb tickets at the official site:", url: "https://www.paris-arc-de-triomphe.fr/" } },
    { time: "4:00pm", name: "Champs-Élysées", address: "Avenue des Champs-Élysées, 75008 Paris",
      mapsUrl: gmaps(48.8729602, 2.2978526, "ChIJUXgA-MRv5kcR9mSP84enoVo"),
      distance: "Walk the avenue itself, ~25 minutes down toward Concorde", recTime: "20–25 minutes (the walk is the sightseeing)",
      history: `Laid out in the 1660s as a garden promenade extending the sightline from the Tuileries, it evolved into Paris's grand ceremonial avenue over the 18th and 19th centuries as the city grew west and the promenade was gradually built up with grand houses, then shops. It now hosts the finish of the Tour de France and the Bastille Day military parade, and every four years is decorated with flags for a different theme representing France's overseas territories or international relations.`,
      fact: `The name translates to "Elysian Fields," the paradise of Greek mythology.`,
      photoTip: `Shoot back up the avenue toward the Arc as you walk — the gentle uphill grade makes for a good perspective shot looking either direction.` },
    { time: "5:00pm", name: "Canal Saint-Martin", address: "Quai de Valmy / Quai de Jemmapes, 75010 Paris",
      mapsUrl: gmapsAddr("Canal Saint-Martin, Quai de Valmy, 75010 Paris"),
      distance: "Metro Concorde → Jacques Bonsergent (~20 min, one transfer), then a 5-minute walk — you're passing back through the Concorde area, though that stop itself stays on Friday's Louvre-day route", recTime: "45–60 minutes",
      history: `Commissioned by Napoleon in 1802 to bring fresh drinking water into Paris and ease congestion on the Seine, the canal opened in 1825 with a system of nine locks and iron footbridges that still operate today, dropping the water level some 25 meters over its 4.5-kilometer course. Much of it runs underground beneath Boulevard Richard-Lenoir, a covering added under Napoleon III in the 1860s partly to prevent it from being used as a barricade line during future uprisings, as it had been in 1848 and would be again in 1871.`,
      fact: `The canal was nearly paved over for a highway in the 1970s; a public campaign saved it, and it's now one of the most photographed corners of the 10th arrondissement.`,
      photoTip: `The arched iron footbridge at Rue de la Grange-aux-Belles frames the canal well, especially under the plane trees.` },

  dinner: { name: "Chez Prune", address: "36 Rue Beaurepaire, 75010 Paris",
    mapsUrl: gmaps(48.8717011, 2.3645708, "ChIJoTaqxQtu5kcRtabbV-ogavc"),
    desc: `A canalside neighborhood bistro that's been a 10th-arrondissement fixture since the late 1990s — simple, honest French plates, no tourist markup, and a front-row seat to the canal's evening foot traffic.`,

    { name: "Marché Couvert Saint-Quentin", address: "85 bis Boulevard de Magenta, 75010 Paris", mapsUrl: gmaps(48.8769631, 2.3551219, "ChIJnef2yI1v5kcRsiX-BMATv8Y"), note: `A handsome 19th-century covered market near Gare de l'Est — good for a browse, a coffee, or picking up something for the road tomorrow.` },

  id: "d2", city: "Paris", dayLabel: "Day 02", dateShort: "Oct 9",

  tagline: "The Louvre & the Left Bank",
  intro: `Your Louvre entry (9:00am–12:00pm) is fixed, so this morning is built backward from that appointment — a short, geographically logical string of exteriors on the walk from the hotel toward the museum.`,

  ],
  stops: [
    { time: "7:15am", name: "Place des Vosges", address: "Place des Vosges, 75004 Paris",
      mapsUrl: gmaps(48.8556114, 2.3655266, "ChIJUeiI4P9x5kcRqEwHl6V32GQ"),
      distance: "~1.7 km from the hotel, 18-minute brisk walk", recTime: "10 minutes",
      history: `Completed in 1612 under Henri IV, it's the oldest planned square in Paris — 36 symmetrical brick-and-stone pavilions arranged around a central garden, built as a showcase of harmonious royal urban design and originally named Place Royale. It was renamed Place des Vosges in 1800 to honor the first French département to pay its Revolutionary war taxes in full, and the square's arcaded ground floors were deliberately designed as covered walkways for shopping, a genuinely novel idea for the time.`,
      fact: `Victor Hugo lived at No. 6 for sixteen years and wrote much of Les Misérables there; the building is now a small museum dedicated to him.`,
      photoTip: `Enter from the northwest corner arcade for a symmetrical view straight down the colonnade.` },
    { time: "7:35am", name: "Notre-Dame Cathedral (exterior)", address: "6 Parvis Notre-Dame – Place Jean-Paul II, 75004 Paris",
      mapsUrl: gmaps(48.8529682, 2.3499021, "ChIJATr1n-Fx5kcRjQb6q6cdQDY"),
      distance: "~1.3 km, 14 minutes", recTime: "15 minutes",
      history: `Construction began in 1163 under Bishop Maurice de Sully and took roughly two centuries to complete, making it one of the first Gothic cathedrals built on this scale in France. The cathedral has crowned French kings, hosted Napoleon's coronation in 1804 — where he famously seized the crown from the Pope and placed it on his own head — and survived the Revolution, when it was rededicated as a Temple of Reason and stripped of its statues, many of which were beheaded on the belief they depicted French kings rather than biblical ones. A fire in April 2019 destroyed the spire and roof; the cathedral reopened to the public in December 2024 after a five-year restoration that used traditional techniques and materials wherever possible, including hand-hewn oak beams for the roof frame.`,
      fact: `The spire lost in the 2019 fire was itself a 19th-century addition by Viollet-le-Duc, not part of the original medieval structure — it has since been rebuilt to his exact design, down to the rooster weathervane at its tip.`,
      photoTip: `The west façade from directly across the square is the classic shot; the flying buttresses are best seen from Square Jean XXIII behind the apse.`,
      booking: { label: "Entry to the cathedral is free, no advance ticket required.", url: "https://www.notredamedeparis.fr/en/" },
      badge: { type: "warn", text: "Free reservation — book the day before" } },
    { time: "7:55am", name: "Sainte-Chapelle (exterior)", address: "8 Boulevard du Palais, 75001 Paris",
      mapsUrl: gmaps(48.855375, 2.3449609, "ChIJR3122B9u5kcRaCck3PlB9DM"),
      distance: "~350 m, 5 minutes", recTime: "5 minutes",
      history: `Built between 1242 and 1248 by Louis IX to house the Crown of Thorns and other relics he had acquired at extraordinary cost — reportedly half the kingdom's annual revenue — the chapel was completed in barely six years, a remarkably fast build for the period. Its Upper Chapel holds one of the most complete collections of 13th-century stained glass anywhere in the world: 15 windows and a rose window, over 1,100 individual scenes, covering nearly the entire wall surface so the stonework seems to dissolve into color.`,
      fact: `The relics that justified the chapel's construction have since been relocated to Notre-Dame's treasury.`,
      photoTip: `The spire is best seen from Boulevard du Palais, looking north.`,
      booking: { label: "Official timed-entry tickets (for the interior stained glass) at:", url: "https://www.sainte-chapelle.fr/" } },
    { time: "9:00–12:00", name: "Musée du Louvre", address: "Rue de Rivoli, 75001 Paris",
      mapsUrl: gmaps(48.8606111, 2.337644, "ChIJD3uTd9hx5kcR1IQvGfr8dbk"),
      distance: "~700 m, 8 minutes from Sainte-Chapelle", recTime: "Fixed — your 3-hour booking",
      history: `Originally built as a fortress by Philip II in the late 12th century to defend Paris's western flank against a possible English attack, it was rebuilt as a royal residence through the Renaissance under François I, who also began the museum's core art collection by inviting Leonardo da Vinci to France. Successive kings expanded the palace for three more centuries until the Revolutionary government opened it as a public museum in 1793, a deliberate symbolic act — royal treasures now belonged to the citizens. I.M. Pei's glass pyramid, added in 1989 as the new main entrance, remains debated among purists but has become an icon in its own right, and its 673 glass panes were, contrary to persistent rumor, never actually 666.`,
      fact: `The museum displays roughly 35,000 works out of a collection of over 600,000 — spend just 30 seconds on each displayed work, and it would take over 100 days to see them all.`,
      photoTip: `The pyramid reflecting the surrounding Cour Napoléon buildings works best in soft morning light before the plaza fills.`,
      booking: { label: "You're already ticketed. Official timed entries are exclusively at:", url: "https://ticket.louvre.fr/en" },
      badge: { type: "ok", text: "Booked" } },
    { time: "1:15pm", name: "Jardin des Tuileries", address: "Place de la Concorde end / Louvre end, 75001 Paris",
      mapsUrl: gmaps(48.8634916, 2.3274943, "ChIJAQAAMCxu5kcRx--_4QnbGcI"),
      distance: "Adjacent to the Louvre", recTime: "15 minutes",
      history: `Laid out in 1564 for Catherine de' Medici as the garden of the (now-destroyed) Tuileries Palace, it was redesigned in the 1660s by André Le Nôtre — who later designed the gardens of Versailles — into the formal French style still visible today, with its rigid geometric parterres and long central perspective.`,
      fact: `It was the first Parisian garden opened to the general public, in the late 17th century — a genuinely radical idea for a royal garden at the time.`,
      photoTip: `The central allée looking back toward the Louvre pyramid lines up almost perfectly around midday.` },
    { time: "1:45pm", name: "Place de la Concorde", address: "Place de la Concorde, 75008 Paris",
      mapsUrl: gmaps(48.8656331, 2.3212357, "ChIJAQquYc1v5kcRLKslDuENAxg"),
      distance: "~900 m, 10 minutes", recTime: "10 minutes",
      history: `Laid out in the 1750s and originally named Place Louis XV after the reigning king whose equestrian statue once stood at its center, the square was renamed Place de la Révolution during the Terror and became the site of the guillotine, where Louis XVI, Marie Antoinette, and roughly 1,100 others were executed between 1793 and 1795. It was given its current, deliberately conciliatory name — Concorde, meaning harmony — in 1795 as France tried to move past that period. The 3,300-year-old Luxor Obelisk, a gift from the Ottoman viceroy of Egypt in 1836 in exchange for a mechanical clock (which never worked), now stands at its center.`,
      fact: `The obelisk's hieroglyphs recount the reign of Ramesses II; a golden cap was added in 1998 to replace one stolen in antiquity.`,
      photoTip: `Stand at the obelisk's base and look down the Champs-Élysées toward the Arc de Triomphe for the axis shot.` },
    { time: "2:15pm", name: "Musée d'Orsay", address: "Esplanade Valéry Giscard d'Estaing, 75007 Paris",
      mapsUrl: gmaps(48.8599614, 2.3265614, "ChIJG5Qwtitu5kcR2CNEsYy9cdA"),
      distance: "~1.1 km across the river via Pont Royal, 12 minutes", recTime: "10 minutes",
      history: `Housed in the former Gare d'Orsay, a Beaux-Arts railway station built for the 1900 World's Fair and once the terminus for trains to southwestern France, it fell out of use as trains grew too long for its platforms and narrowly escaped demolition in the 1970s before being converted into a museum in 1986. It now holds the world's largest collection of Impressionist and Post-Impressionist masterpieces, effectively bridging the gap in the timeline between the Louvre's collection and the modern art of the Centre Pompidou.`,
      fact: `The station's original giant clock, once used by travelers to catch their trains, is now one of the museum's most photographed interior features — visitors often line up just to be photographed through its glass face.`,
      photoTip: `The façade and clock are best photographed from across the Seine, on the Tuileries side.`,
      booking: { label: "Tickets at the official site (the museum warns against third-party resellers and mirror sites):", url: "https://www.musee-orsay.fr/en/visit/admission-opening-times-tickets" },
      badge: { type: "ok", text: "Booked" } },
    { time: "2:45pm", name: "Île Saint-Louis", address: "Île Saint-Louis, 75004 Paris",
      mapsUrl: gmaps(48.8515572, 2.3574207, "ChIJ5Y5Ovfxx5kcRMHVGaekEwFY"),
      distance: "Metro Concorde → Sully–Morland (~15 min), or a longer riverside walk", recTime: "30 minutes",
      history: `Once two uninhabited islets used for grazing cattle and dueling, and known as much for the tolls charged on the timber rafted down the Seine here as for anything else, the island was developed in the 1600s into an elegant residential quarter by the property developer Christophe Marie, whose contract gave the project its name (the Pont Marie still bears it). It has remained one of Paris's quietest, most exclusive addresses ever since, largely untouched by Haussmann's 19th-century boulevard-building.`,
      fact: `Berthillon, the island's famous ice cream maker, has operated from the same address since 1954.`,
      photoTip: `The Pont Saint-Louis footbridge, connecting to Île de la Cité, gives a nice view back toward Notre-Dame.` },
    { time: "3:30pm", name: "Panthéon (exterior)", address: "Place du Panthéon, 75005 Paris",
      mapsUrl: gmaps(48.8462218, 2.3464138, "ChIJc8mX0udx5kcRWKcjTwDr5QA"),
      distance: "~1.4 km, 15 minutes", recTime: "10 minutes",
      history: `Commissioned by Louis XV in 1758 as a church dedicated to Saint Geneviève, Paris's patron saint, in gratitude for his recovery from a serious illness, it was still unfinished when the Revolution broke out and was secularized in 1791, repurposed as a mausoleum for France's most honored citizens. It has flipped back and forth between church and secular mausoleum several times since, depending on which government was in power, before settling into its current role for good in 1885 at Victor Hugo's funeral.`,
      fact: `Voltaire, Rousseau, Victor Hugo, and Marie Curie are interred beneath its dome; Curie was the first woman honored there on her own merits, in 1995, more than a century after her scientific work began.`,
      photoTip: `The neoclassical dome, modeled loosely on St. Paul's in London, photographs best from Rue Soufflot looking uphill.`,
      booking: { label: "Interior + dome-climb tickets, run by the same national monuments authority as the Arc de Triomphe:", url: "https://www.paris-pantheon.fr/" } },
    { time: "4:15pm", name: "Luxembourg Gardens", address: "Rue de Médicis / Rue de Vaugirard, 75006 Paris",
      mapsUrl: gmaps(48.8466144, 2.3363309, "ChIJe2jeNttx5kcRi_mJsGHdkQc"),
      distance: "~600 m, 7 minutes", recTime: "20 minutes",
      history: `Laid out from 1612 for Marie de' Medici alongside the Luxembourg Palace (now home to the French Senate), in a style meant to evoke the Boboli Gardens of her native Florence — she was so homesick for Italy that she had the palace's original architecture based on the Pitti Palace as well. The gardens later became a haven for artists and writers; Hemingway wrote of hunting pigeons here for food during his lean years in 1920s Paris.`,
      fact: `The gardens contain over 100 statues, including a scaled-down replica of the Statue of Liberty, cast from the same original plaster model as the New York version.`,
      photoTip: `The Medici Fountain, tucked in a shaded grotto, is one of the garden's quieter, more photogenic corners.` },
  ],
  lunch: { name: "Le Fumoir", address: "6 Rue de l'Amiral de Coligny, 75001 Paris", mapsUrl: gmaps(48.8604263, 2.3409253, "ChIJw8kRaSFu5kcRFhLvX5DjiWY"),
    desc: `An elegant café-restaurant literally steps from the Louvre's colonnade, popular with a mix of locals and gallery-goers. Fair prices for the location and food that holds up well.` },

    desc: `A tiny, old-school Left Bank bistro with a chalkboard menu and no pretension — the kind of place that's been feeding the neighborhood, not tourists, for decades.`,

{
  id: "d3", city: "Paris", dayLabel: "Day 03", dateShort: "Oct 10",
  partTitle: "Part 3 — Versailles & Match Day", date: "October 10, 2026",
  tagline: "The Sun King & The Kickoff",
  intro: `With an 8:45pm kickoff, this day finally gives Versailles the time it deserves — Palace, Gardens, and the Trianon Estate, at an unhurried pace — followed by a deliberately open afternoon before dinner near the stadium. There's a direct RER C train from Versailles Château Rive Gauche to Pont du Garigliano, right in the same corner of the 16th as both dinner and the match, so nothing here requires backtracking across the city.`,
  walking: "~4–5 km at Versailles, plus a short walk at each end of the transfers. No fixed plan for the afternoon.",
  notes: [
    { type: "warn", label: "Logistics Note", text: `Your hotel isn't directly on the RER C line, so getting to Versailles means metro to a station like Invalides first (~25–30 min), then RER C to Versailles Château Rive Gauche (~35–40 min) — about 60–70 minutes door to door. Leave the hotel by 7:45am to arrive right around the 9:00am opening.` },
    { type: "warn", label: "Logistics Note", text: `Getting back toward the stadium: RER C direct from Versailles Château Rive Gauche to Pont du Garigliano (18–19 min, no transfer) — the same corner of the 16th arrondissement as tonight's dinner and the match.` },
    { type: "ok", label: "Pacing Note", text: `The afternoon (roughly 4:15–5:45pm) is intentionally left open — no scheduled stop. After a full Versailles day, that's genuine downtime, not a gap to fill. See the backups below for an idea, if you want one.` },
  ],
  stops: [
    { time: "9:00am", name: "Palace of Versailles", address: "Place d'Armes, 78000 Versailles",
      mapsUrl: gmaps(48.8048649, 2.1203554, "ChIJdUyx15R95kcRj85ZX8H8OAU"),
      distance: "~60–70 min from the hotel via metro + RER C (see Logistics Note)", recTime: "~2 hours for the State Apartments and Hall of Mirrors",
      history: `Begun as Louis XIII's modest hunting lodge in 1623, it was transformed by his son Louis XIV, starting in 1661, into the largest palace in Europe and the seat of French government — a deliberate move to pull the aristocracy away from Paris and keep them, and their political ambitions, under close royal watch. Some 36,000 workers labored on it at points, diverting entire rivers to feed its fountains. The Hall of Mirrors, completed in 1684, was also where the treaty ending World War I was signed in 1919, giving the room a second, darker layer of history on top of its Baroque one.`,
      fact: `The palace has 2,300 rooms and over 60 hectares of gardens — Louis XIV moved the entire French court and government here permanently in 1682, and it stayed the seat of power until the Revolution in 1789.`,
      photoTip: `The Hall of Mirrors is brightest and least crowded right at opening — you have the advantage of a 9am slot, so use it.`,
      booking: { label: "Book the earliest available timed Palace entry slot — October Saturdays sometimes run the Musical Gardens fountain show, which needs the Passport ticket rather than the palace-only ticket:", url: "https://en.chateauversailles.fr/2026-ticketing" },
      badge: { type: "ok", text: "Booked" } },
    { time: "11:00am", name: "Gardens of Versailles", address: "Versailles Gardens, 78000 Versailles",
      mapsUrl: gmaps(48.8048649, 2.1203554, "ChIJdUyx15R95kcRj85ZX8H8OAU"),
      distance: "Exit directly from the palace", recTime: "2 hours — genuinely unhurried, including the walk out to the Grand Canal",
      history: `Designed by André Le Nôtre over roughly 40 years starting in 1661, the gardens are the definitive expression of the French formal style — rigid geometry, radial paths, and sightlines engineered so that fountains, statues, and the palace itself all align from key vantage points. The Grand Canal alone is 1.6 km long and was once used for mock naval battles and gondola rides for the court.`,
      fact: `The gardens' fountains were such an engineering challenge that Louis XIV commissioned the never-completed "Machine de Marly," a giant pumping system on the Seine, just to keep them running.`,
      photoTip: `The Latona Fountain, looking back up toward the palace façade, is the classic wide shot; the Grand Canal itself is worth the longer walk today, since you have the time.`,
      badge: { type: "ok", text: "Booked" } },
    { time: "2:00pm", name: "Grand Trianon & Marie-Antoinette's Estate", address: "Porte Saint-Antoine, 78000 Versailles",
      mapsUrl: gmaps(48.8145625, 2.1047193, "ChIJ-ac2pb595kcRjWfiSzvnvxk"),
      distance: "A short walk from the Grand Canal, within the estate", recTime: "1.5 hours",
      history: `Built in 1687 for Louis XIV as a smaller, more private retreat from the formality of the main palace, the Grand Trianon is faced entirely in pink Languedoc marble and was where the king could receive guests without the rigid court etiquette required elsewhere on the grounds. Marie-Antoinette later made the nearby Petit Trianon and the rustic Queen's Hamlet her own personal domain, a place where she could escape Versailles' court life almost entirely — famously (if apocryphally) associated with the phrase "let them eat cake."`,
      fact: `The Estate of Trianon opens later than the main palace (noon on weekdays, though it's open from earlier on weekends) — worth knowing if you're ever planning a Versailles day where timing is tighter than today's.`,
      photoTip: `The pink marble colonnade of the Grand Trianon catches warm afternoon light particularly well.` },
  ],
  lunch: { name: "La Flottille", address: "Parc du Château de Versailles", mapsUrl: gmaps(48.8091371, 2.1083631, "ChIJHUtWX5B95kcRFO1gkhwNR-s"),
    desc: `Right on the Grand Canal, a relaxed sit-down lunch worked naturally into the Gardens walk rather than a rushed stop.` },
  dinner: { name: "Le Cardinal", address: "5 Place de la Porte de Saint-Cloud, 75016 Paris", mapsUrl: gmaps(48.8373002, 2.2574612, "ChIJN41FPcB65kcRR0c1FWQSirE"),
    desc: `A well-reviewed French bistro right on Place de la Porte de Saint-Cloud, a 2-minute walk from the stadium — genuinely close, not just "nearby," so there's no rush after dinner.`,

  backups: [
    { name: "Jardin des Serres d'Auteuil", address: "3 Avenue de la Porte d'Auteuil, 75016 Paris", mapsUrl: gmaps(48.8463076, 2.2521865, "ChIJQWzKlMd65kcRtvMzCcfxEdM"), note: `Free entry, a ~20-minute walk from Pont du Garigliano — a genuinely peaceful botanical garden and greenhouse if you want a low-key idea for the open afternoon.` },
    { name: "Musée Marmottan Monet", address: "2 Rue Louis Boilly, 75016 Paris", mapsUrl: gmaps(48.8592613, 2.2672282, "ChIJYfRHlFJl5kcRTIXaVRFhx04"), note: `The world's largest Monet collection, a bit further north in the 16th — a good option only if you'd rather spend the open afternoon on something specific.` },
    { name: "Bois de Boulogne", address: "75016 Paris", mapsUrl: gmaps(48.8619839, 2.2523138, "ChIJ28laW9p65kcRLkyGSRGcV04"), note: `Paris's second-largest park, close to Pont du Garigliano — an easy, unstructured green space if you just want to wander without a destination.` },
  ],
  closing: `Walk to Parc des Princes (~10 minutes) after dinner, arriving by 7:45pm for the 8:45pm kickoff.`

{
  id: "d4", city: "Paris", dayLabel: "Day 04", dateShort: "Oct 11",
  partTitle: "Part 4 — Free Day (Eiffel Tower Summit)", date: "October 11, 2026",
  tagline: "Iron, Gold & Kilometers on Foot",
  intro: `Your Eiffel Tower summit elevator booking (10:00am) anchors this day, and it sits in the far west of the city — a good distance from the Montmartre landmarks in the far north. The day is built as a loop through both: dawn in Montmartre first, then west toward the Tower — with Trocadéro slotted into the buffer time before your entry — then a real interior visit to Napoleon's Tomb at Les Invalides, a sweep back east through the Marais, and north to Opéra before ending in Montmartre/Pigalle for dinner.`,
  walking: "~6 km on foot, plus four metro hops to cover the geography a fixed morning appointment requires.",
  notes: [

    { type: "warn", label: "Pacing Note", text: `The Napoleon's Tomb interior visit adds about 30 minutes to the middle of the day compared to the original exterior-only stop, so everything from the Marais onward runs about 25 minutes later than before. Nothing else about the day changes.` },
  ],
  stops: [
    { time: "7:00am", name: "Sacré-Cœur Basilica", address: "35 Rue du Chevalier de la Barre, 75018 Paris",
      mapsUrl: gmaps(48.8867046, 2.3431043, "ChIJ442GNENu5kcRGYUrvgqHw88"),
      distance: "~2.4 km from the hotel; metro Strasbourg–Saint-Denis → Anvers (~12 min), then a short climb", recTime: "15 minutes",
      history: `Built between 1875 and 1914 as a national penance project after France's defeat in the Franco-Prussian War and the bloody suppression of the Paris Commune, funded almost entirely by public subscription rather than state money — a deliberate statement of Catholic revival. Its travertine stone, quarried from Château-Landon, secretes calcite when it rains, which is why the basilica's white façade never seems to darken or age the way most Parisian buildings have.`,
      fact: `The hill it sits on, Montmartre, means "Mount of Martyrs," referring to the 3rd-century beheading of Paris's patron saint, Saint Denis, who according to legend picked up his own severed head and walked several kilometers preaching a sermon before finally collapsing.`,
      photoTip: `The front steps at dawn are nearly empty — the wide staircase framing the basilica is the classic shot.` },
    { time: "7:15am", name: "Montmartre Village", address: "Place du Tertre, 75018 Paris",
      mapsUrl: gmaps(48.8865728, 2.3408278, "ChIJF9eP_k9u5kcRYujwQAgfqvQ"),
      distance: "Adjacent, 5 minutes", recTime: "30 minutes",
      history: `A semi-rural artists' village annexed by Paris only in 1860, it kept its own windmills, vineyards, and bohemian, semi-lawless character well into the 20th century, drawing Picasso, Renoir, Modigliani, and Toulouse-Lautrec to its cheap studios and lively cabarets. Picasso painted Les Demoiselles d'Avignon, arguably the founding work of Cubism, in a Montmartre studio building nicknamed the Bateau-Lavoir, just a few streets from Place du Tertre.`,
      fact: `Montmartre still has a small working vineyard, Clos Montmartre, producing a few hundred bottles a year, auctioned for charity at the annual grape harvest festival.`,
      photoTip: `Rue de l'Abreuvoir and Rue Norvins have the best-preserved cobblestone-and-ivy village feel.` },
    { time: "7:45am", name: "Moulin Rouge (exterior)", address: "82 Boulevard de Clichy, 75018 Paris",
      mapsUrl: gmaps(48.8841232, 2.3322519, "ChIJiQxv_05u5kcRESFIh6-QTvQ"),
      distance: "~800 m, 10 minutes, on the way down to the metro", recTime: "5 minutes",
      history: `Opened in 1889, the same year as the Eiffel Tower, it helped invent the cabaret and popularized the can-can as a stage spectacle rather than a spontaneous street dance, drawing artists like Toulouse-Lautrec, whose posters of the venue's performers helped define both the venue's image and the poster-art movement itself.`,
      fact: `The original building burned down in 1915; the red windmill seen today is a later reconstruction, and its sails have never actually generated power — they're purely decorative.`,
      photoTip: `Early morning light avoids the crowds that gather here later in the day for photos.` },
    { time: "8:25am", name: "Trocadéro Esplanade", address: "Place du Trocadéro et du 11 Novembre, 75116 Paris",
      mapsUrl: gmaps(48.8627982, 2.2876042, "ChIJpSFnZvtv5kcRlSMne7c0v40"),
      distance: "Depart Moulin Rouge by 8:00am; metro Blanche → Trocadéro (~25 min, one transfer)", recTime: "20 minutes",
      history: `The current esplanade and its flanking Palais de Chaillot wings were built for the 1937 World's Fair, replacing an earlier Moorish-Byzantine-style palace from 1878 that had grown structurally unsound and unfashionable. The square's name commemorates the 1823 Battle of Trocadero in Spain, a curious bit of naming for a spot now defined almost entirely by its view of a French monument.`,
      fact: `This terrace is one of the few spots in Paris where the entire Eiffel Tower fits into a single photo without a wide-angle lens.`,
      photoTip: `Go early, before the crowds and souvenir vendors set up — this slots neatly into the buffer before your Tower entry.` },
    { time: "10:00am", name: "Eiffel Tower — Summit by Elevator", address: "Avenue Gustave Eiffel, 75007 Paris",
      mapsUrl: gmaps(48.8583701, 2.2944813, "ChIJLU7jZClu5kcR4PcOOO6p3I0"),
      distance: "Across the Seine via Pont d'Iéna, ~700 m, 8 minutes from Trocadéro", recTime: "~2 hours total, including elevator queues both ways",
      history: `Designed by Gustave Eiffel's engineering firm — the actual lead designers were Maurice Koechlin and Émile Nouguier, with Eiffel buying the patent and lending his name — for the 1889 World's Fair to mark the centennial of the French Revolution, it was intended as a temporary 20-year structure and nearly torn down in 1909. It survived because Eiffel had the foresight to install a radio antenna on top, making the tower useful for military and civilian communication just as its permit was expiring. From the summit, 276 meters up, the view stretches roughly 70 km on a clear day.`,
      fact: `The tower grows about 15 cm taller in summer as the iron structure expands in the heat, and it leans slightly away from the sun during the day as the metal on the sunward side warms and expands faster.`,
      photoTip: `From the summit, the best shots look north over the curve of the Seine — try to get there before the top level gets crowded with the next elevator group.`,
      booking: { label: "You're already ticketed for the 10:00am elevator to the summit.", url: "https://www.toureiffel.paris/en/rates-opening-times" },
      badge: { type: "ok", text: "Booked" } },
    { time: "12:15pm", name: "Les Invalides", address: "129 Rue de Grenelle, 75007 Paris",
      mapsUrl: gmaps(48.8557933, 2.3125934, "ChIJv-rX7Ndv5kcRJ0IdTc55HnY"),
      distance: "~1.8 km, 20-minute walk from the Tower — same arrondissement, no metro needed", recTime: "45 minutes (interior — Dôme Church & Napoleon's Tomb)",
      history: `Commissioned by Louis XIV in 1670 as a hospital and retirement home for wounded and elderly soldiers — a genuinely progressive social institution for its time, housing up to 4,000 veterans at its peak — its golden dome, added by the great Baroque architect Jules Hardouin-Mansart in 1706, now shelters Napoleon's tomb, which wasn't installed until 1861, twenty years after his remains were returned from Saint Helena. Stepping inside the Dôme Church, the circular crypt sits below floor level, so visitors look down on the sarcophagus from a ring of arches above — a deliberately theatrical piece of 19th-century tomb design by architect Louis Visconti.`,
      fact: `Napoleon's remains rest inside six nested coffins — iron, mahogany, two lead, ebony, and oak — one inside the next, like a Russian nesting doll.`,
      photoTip: `The view down onto the sarcophagus from the ring gallery above is the classic shot — try to get a spot along the railing rather than shooting through the crowd at the center.`,
      booking: { label: "Musée de l'Armée interior + tomb access, at the official site:", url: "https://www.musee-armee.fr/en/your-visit/opening-times-and-prices-1.html" },
      badge: { type: "ok", text: "Booked" } },
    { time: "1:00pm", name: "Place des Vosges & Le Marais", address: "Place des Vosges, 75004 Paris",
      mapsUrl: gmaps(48.8556114, 2.3655266, "ChIJUeiI4P9x5kcRqEwHl6V32GQ"),
      distance: "Metro La Tour-Maubourg → Saint-Paul (~25 min with a transfer)", recTime: "20 minutes",
      history: `See Day 2 for the square's history — worth a second, more relaxed pass, or a first look if you skipped it on Louvre day. The surrounding Marais district escaped Baron Haussmann's 19th-century boulevard-building program almost entirely because it had already fallen out of aristocratic fashion by the 1700s, which is exactly why its medieval and Renaissance street pattern survives intact today.`,
      fact: `The Marais was Paris's Jewish quarter for centuries and remains a center of Jewish life in the city, alongside its status today as a major LGBTQ+ neighborhood and a hub of contemporary art galleries.`,
      photoTip: `The arcaded walkway around the square's perimeter, especially with the midday light coming through.` },
    { time: "1:45pm", name: "Centre Pompidou (exterior)", address: "Place Georges Pompidou, 75004 Paris",
      mapsUrl: gmaps(48.8608316, 2.3517012, "ChIJFwqVS71v5kcRx07AoPuLgBw"),
      distance: "~600 m, 7 minutes", recTime: "10 minutes",
      history: `Opened in 1977, designed by the then-unknown architects Renzo Piano and Richard Rogers, who won an international competition with a design that turned the building's structural skeleton and mechanical systems inside-out, freeing the interior floors to be vast, flexible, column-free space. It was radical and controversial at the time — critics called it an oil refinery — but has since become one of the most influential buildings of the 20th century and a template for high-tech architecture worldwide. The museum has been closed for a major renovation since 2025, expected to last several years, so an exterior visit is the only option regardless of preference right now.`,
      fact: `The color coding on the exposed pipework is functional: blue for air, green for water, yellow for electricity, red for movement (elevators and escalators).`,
      photoTip: `The sloped plaza in front captures the full tangle of exterior pipework.` },
    { time: "2:00pm", name: "Hôtel de Ville", address: "Place de l'Hôtel de Ville, 75004 Paris",
      mapsUrl: gmaps(48.8564826, 2.3524135, "ChIJi1uPs_1x5kcRbh8M8XJSNMA"),
      distance: "~800 m, 9 minutes", recTime: "10 minutes",
      history: `Paris's city government has occupied this site since 1357, though the current building is a Renaissance-revival reconstruction completed in 1892, replacing the original 17th-century town hall, which burned down during the violent final days of the Paris Commune in 1871, when retreating Communards set fire to it along with much of central Paris.`,
      fact: `Its façade is studded with 108 statues of notable Parisians, each one selected and sculpted individually — a project that took decades to complete.`,
      photoTip: `The square in front often hosts temporary installations, from ice rinks in winter to beach volleyball courts in summer — check what's on before you go.` },
    { time: "2:35pm", name: "Palais Garnier", address: "Place de l'Opéra, 75009 Paris",
      mapsUrl: gmaps(48.8719697, 2.3316014, "ChIJOYNm1DBu5kcRZwdtKBzyq6k"),
      distance: "Metro Hôtel de Ville → Opéra (~15 min with a transfer)", recTime: "15 minutes (exterior + lobby if open)",
      history: `Built between 1861 and 1875 under Napoleon III, designed by the then largely unknown 35-year-old architect Charles Garnier, who won a design competition against 170 other entrants by proposing something entirely different from the Neo-Palladian style the judges expected — a maximalist mix of Baroque, Renaissance, and Second Empire opulence he later called simply "Napoléon III style." Its legendary chandelier and labyrinthine backstage, including a genuine underground water table beneath the building, inspired Gaston Leroux's "The Phantom of the Opera."`,
      fact: `A counterweight from the chandelier fell in 1896, killing a stagehand — an incident widely believed to have inspired the chandelier-crash scene in Leroux's novel, published just eleven years later.`,
      photoTip: `The façade from Place de l'Opéra, or the Grand Escalier if you go inside.`,
      booking: { label: "Self-guided visit tickets at the official site:", url: "https://www.operadeparis.fr/en/visits/palais-garnier" } },
    { time: "2:55pm", name: "Galeries Lafayette Rooftop", address: "40 Boulevard Haussmann, 75009 Paris",
      mapsUrl: gmaps(48.873629, 2.332015, "ChIJSXEyCTdu5kcRjWZ8CnrNIlY"),
      distance: "5-minute walk", recTime: "15 minutes",
      history: `The department store opened in 1912, its Art Nouveau glass dome — 43 meters tall and inspired by Byzantine architecture — designed to rival the grand department stores of London and New York and cement Paris's status as the capital of luxury retail.`,
      fact: `The rooftop terrace is free and one of the only elevated viewpoints in Paris that costs nothing, with a clear sightline to the Eiffel Tower, the Sacré-Cœur, and the Opéra dome all at once — a nice bookend to the summit view from earlier in the day.`,
      photoTip: `Look south for a skyline shot that lines up the Eiffel Tower and the Opéra dome in one frame.` },
  ],
  lunch: { name: "L'As du Fallafel", address: "34 Rue des Rosiers, 75004 Paris", mapsUrl: gmaps(48.8574067, 2.3591962, "ChIJL5QZXQJu5kcRwsTfM6YEA3E"),
    desc: `The best-value lunch in central Paris, a stuffed falafel pita for under €10, right in the Marais as you pass through. Always a line, always worth it.` },
  dinner: { name: "Bouillon Pigalle", address: "22 Boulevard de Clichy, 75018 Paris", mapsUrl: gmaps(48.8826242, 2.3374171, "ChIJVb7Sx0Vu5kcR5gDcYjssPWw"),
    desc: `A modern revival of the old Parisian "bouillon" concept: honest, cheap French classics in a grand belle-époque room. Expect a short line that moves fast — and it brings you right back to this morning's Montmartre neighborhood for a fitting close to the day.`,
    mustTry: `Escargots or the steak-frites.` },
  backups: [
    { name: "Musée Rodin", address: "77 Rue de Varenne, 75007 Paris", mapsUrl: gmaps(48.8553072, 2.3158354, "ChIJQ9vMHipw5kcRWHC2ESjYaGQ"), note: `A sculpture garden right next to Les Invalides — The Thinker sits outside. If the summit visit runs short, this is the easiest, closest add of the day.` },
    { name: "Rue Cler", address: "Rue Cler, 75007 Paris", mapsUrl: gmaps(48.857448, 2.3061987, "ChIJh32iCt9v5kcRv8zeQH_P9hI"), note: `A lively pedestrian market street near the Eiffel Tower — cheese shops, bakeries, a good spot to grab a coffee or snack between the Tower and Invalides.` },
    { name: "Église Saint-Eustache", address: "2 Impasse Saint-Eustache, 75001 Paris", mapsUrl: gmaps(48.8633903, 2.3451211, "ChIJK6mOeCJu5kcRpE3-oj_GxD4"), note: `A vast Gothic church near Centre Pompidou/Les Halles — free, genuinely striking stained glass, and far fewer crowds than Notre-Dame.` },
    { name: "Place de la Bastille", address: "Place de la Bastille, 75004 Paris", mapsUrl: gmaps(48.8532379, 2.3688654, "ChIJKZKprAFy5kcREOvlZ8mwHiM"), note: `The July Column and the site of the 1789 storming — a reasonable extension east of the Marais if you're moving faster than planned.` },
  ],
  closing: `Rest at the hotel in the late afternoon before heading back up to Pigalle for dinner (~10 min by metro from Opéra) — this is your buffer before tomorrow's early train.`
},
{
  id: "d5", city: "Luxembourg", dayLabel: "Day 05", dateShort: "Oct 12",
  partTitle: "Part 5 — Luxembourg City", date: "October 12, 2026",
  tagline: "Fortress on the Alzette",
  transfer: `<b>Departure Day — Paris → Luxembourg.</b> Train leaves Gare de l'Est at 7:20am, a 5–8 minute walk from the hotel. No touring this morning — checkout, a quick bakery breakfast on the way, then the train. Most bakeries near the hotel open by 6:30am. Train: Paris Gare de l'Est → Luxembourg, departing 7:20am, arriving 9:35am.`,
  intro: `You arrive at 9:35am, but your onward train to Brussels leaves at 6:09am the next morning — this is really one afternoon and evening, not a full day.`,
  hotel: { address: "2 Rue du Fort Olisy, Pfaffenthal, 2261 Luxembourg", url: gmaps(49.6130176, 6.1379163, "ChIJr4uNWDJPlUcRkwy_lkQ78DQ") },
  walking: "~4 km, plus the elevator.",
  notes: [
    { type: "warn", label: "Logistics Note", text: `Your hotel sits right by the free Pfaffenthal public elevator, which solves the one real obstacle in Luxembourg City: the steep valley between the lower town and the upper Old Town. Drop bags at the hotel if check-in allows (or ask the hotel to hold luggage), then head straight up to the Old Town via the elevator — it saves a genuinely steep climb in both directions.` },
  ],
  stops: [
    { time: "1:00pm", name: "Chemin de la Corniche", address: "Chemin de la Corniche, Ville-Haute, Luxembourg City",
      mapsUrl: gmaps(49.6101047, 6.1343636, "ChIJOwUzkdJIlUcRsm1WX7BzObU"),
      distance: "Via the Pfaffenthal elevator to the Old Town, then ~800 m", recTime: "20 minutes",
      history: `Built along the remnants of the city's fortifications — once described by military engineers as among the strongest in Europe, having been besieged and rebuilt by Burgundians, Habsburgs, Spanish, French, and Prussians over the centuries, each adding their own layer of defenses. The fortress was dismantled after the 1867 Treaty of London declared Luxembourg a permanently neutral state, a process that took sixteen years and used 24 million kilograms of dynamite to demolish walls up to 8 meters thick.`,
      fact: `Often called "Europe's most beautiful balcony," a nickname dating back to at least the early 20th century, coined by admiring visitors taking in the view over the Alzette valley below.`,
      photoTip: `Looking down toward the Alzette river bend and Neumünster Abbey is the classic frame.` },
    { time: "1:30pm", name: "Bock Casemates", address: "Montée de Clausen, 1343 Grund, Luxembourg City",
      mapsUrl: gmaps(49.6117717, 6.1366992, "ChIJNW7n4zJPlUcRc95AAJEMmcY"),
      distance: "~400 m, 5 minutes", recTime: "45 minutes",
      history: `The Bock promontory has been fortified since 963 AD, when Count Siegfried built the first castle here — the founding structure of Luxembourg City itself. The casemates as they exist now, roughly 17 km of tunnels at their peak, were carved and expanded by Spanish military engineers starting in 1644 and later enlarged by the Austrians in the 18th century, eventually earning the city the nickname "Gibraltar of the North" for its perceived impregnability.`,
      fact: `The tunnels could once shelter up to 35,000 people and their livestock during a siege, complete with bakeries, slaughterhouses, and workshops carved into the rock.`,
      photoTip: `The Bock promontory, viewed from the Grund below, shows the layered stonework well.`,
      booking: { label: "Open through November 2, 2026; ~€8, no advance booking needed in October. Tickets via:", url: "https://www.luxembourg-city.com/en" } },
    { time: "2:45pm", name: "Notre-Dame Cathedral", address: "Rue Notre Dame, 2240 Ville-Haute, Luxembourg City",
      mapsUrl: gmaps(49.6099441, 6.131558, "ChIJ8Yc5p9RIlUcRxiaoQPb0gI0"),
      distance: "~600 m, 7 minutes", recTime: "10 minutes",
      history: `Built in the early 17th century as a Jesuit church, consecrated in 1621, it became the national cathedral in 1870 after Luxembourg's diocese was formally established, and it holds the crypt of the Grand Ducal family alongside the tomb of the blind King John of Bohemia, a Luxembourg-born medieval ruler famous for riding into a fatal battle at Crécy in 1346 despite being unable to see.`,
      fact: `Its Baroque west portal, added in 1613, is considered one of the earliest and finest examples of the style north of the Alps.`,
      photoTip: `The twin spires photograph best from Boulevard Roosevelt, looking uphill.` },
    { time: "3:15pm", name: "Grand Ducal Palace (exterior)", address: "17 Rue du Marché-aux-Herbes, 1728 Ville-Haute, Luxembourg City",
      mapsUrl: gmaps(49.6108879, 6.1327603, "ChIJX3FcNi1PlUcRiAHqH_ajLS0"),
      distance: "~300 m, 4 minutes", recTime: "10 minutes",
      history: `Built originally as the city's first town hall in 1418, destroyed by a gunpowder explosion in the building's own basement in 1554, and rebuilt twenty years later in an ornate Flemish Renaissance style with the distinctive stepped gables still visible today. It has served as the official residence and workplace of the Grand Ducal family since 1890, when Luxembourg's line of succession separated from the Dutch monarchy after centuries of shared rulers.`,
      fact: `Guided interior tours run only from mid-July through the end of August, so October is exterior-only — the ceremonial guard is still on duty daily regardless, in a dark blue uniform rather than the more famous bright red of other European royal guards.`,
      photoTip: `The ornate stone façade catches good side light in the late afternoon.`,
      booking: { label: "Interior tours (summer only, not available for your dates):", url: "https://www.luxembourg-city.com/en/place/iconic-buildings/grand-ducal-palace" } },
    { time: "3:45pm", name: "Place Guillaume II & Place d'Armes", address: "Place Guillaume II, 1648 Ville-Haute, Luxembourg City",
      mapsUrl: gmaps(49.6106802, 6.1311262, "ChIJq5mRM9NIlUcR8ElHIwxZKp8"),
      distance: "~200 m, 3 minutes", recTime: "20 minutes",
      history: `Place Guillaume II was built over a demolished Franciscan convent in the early 19th century, named for the Grand Duke who commissioned the neoclassical Town Hall there in 1830; Place d'Armes, one block over, was originally the city's military parade ground before being converted into a public garden and café square in the 19th century as the old fortress lost its military purpose.`,
      fact: `The equestrian statue at the center of Place Guillaume II depicts William II, who was simultaneously King of the Netherlands and Grand Duke of Luxembourg — a dual role the two countries shared under one monarch until 1890, when the lack of a male Dutch heir triggered the split.`,
      photoTip: `Place d'Armes' café terraces make a nice foreground for a shot of the Town Hall's neoclassical façade.` },
  ],
  dinner: { name: "Café-Restaurant Um Dierfgen", address: "6 Côte d'Eich, 1450 Luxembourg City", mapsUrl: gmaps(49.6121453, 6.1316291, "ChIJRbJf6CxPlUcRF8N1gBYQ8L8"),
    desc: `A cozy, genuinely traditional Luxembourgish kitchen in the Old Town — reservations recommended, it fills up.`,
    mustTry: `Judd mat gaardebounen (smoked pork collar with broad beans, the national dish) or kniddelen with bacon and cream.` },
  backups: [
    { name: "Neumünster Abbey", address: "28 Rue Münster, 2160 Grund, Luxembourg City", mapsUrl: gmaps(49.6104853, 6.1363856, "ChIJ020-aM1IlUcRgRNhsNgxsAc"), note: `A former abbey turned cultural center, right in the Grund on your Corniche walk — easy to duck into if you're moving faster than expected.` },
    { name: "Pont Adolphe", address: "Ville-Haute, Luxembourg City", mapsUrl: gmaps(49.6083531, 6.1270177, "ChIJ2-f5X9RIlUcRznEwz2XUlf0"), note: `One of the city's most iconic views — a monumental bridge over the valley, about a 10-minute walk from Place Guillaume II.` },
    { name: "Musée Dräi Eechelen", address: "5 Park Dräi Eechelen, 1499 Clausen, Luxembourg City", mapsUrl: gmaps(49.6163693, 6.139253, "ChIJAbH8mzFPlUcRNmqMzPQ2sjU"), note: `A fortress museum in the restored Fort Thüngen, in the Kirchberg district — a bit further out (~20 min), free admission, worth it if you have a real extra hour.` },
  ],
  closing: `Early night — the train to Brussels leaves at 6:09am.`
},
{
  id: "d6", city: "Brussels", dayLabel: "Day 06", dateShort: "Oct 13",
  partTitle: "Part 6 — Brussels", date: "October 13, 2026",
  tagline: "Grand Place & Guildhalls",
  transfer: `<b>Departure Day — Luxembourg → Brussels.</b> Train: Luxembourg → Bruxelles-Central, departing 6:09am, arriving 9:23am. No touring this morning — just the transfer.`,
  intro: `A full day inside a compact historic core — the entire route below stays within roughly 1.5 km of Grand Place, so there's no wasted transit time today.`,
  hotel: { address: "Rue du Vieux Marché aux Grains 8-12, 1000 Brussels", url: gmapsAddr("Rue du Vieux Marché aux Grains 8-12, 1000 Brussels") },
  walking: "~5 km.",
  notes: [
    { type: "ok", label: "Pacing Note", text: `This is a comfortably full day without being punishing. It deliberately skips the Atomium — a worthwhile sight, but a 40-minute round-trip detour by metro that would cut into the historic-center route without adding proportional value on a single-day visit.` },
  ],
  stops: [
    { time: "9:45am", name: "Grand Place", address: "Grote Markt, 1000 Brussels",
      mapsUrl: gmaps(50.8467887, 4.3524356, "ChIJ8fEURn_Ew0cRts_ij101PLA"),
      distance: "~500 m from Bruxelles-Central, 6 minutes", recTime: "20 minutes",
      history: `The medieval market square was largely rebuilt in just four years after a devastating French bombardment in August 1695 — ordered by Louis XIV's Marshal de Villeroy as a diversionary tactic during the Nine Years' War — destroyed nearly 4,000 buildings and most of the surrounding guildhalls. The Gothic Town Hall, remarkably, survived largely intact, supposedly because the French used its spire as their targeting reference point and were reluctant to destroy their own aiming marker. Victor Hugo, exiled in Brussels in the 1850s after criticizing Napoleon III, lived on the square and called it "the most beautiful square in the world."`,
      fact: `Every two years, the square is carpeted with roughly 500,000 begonias for the Brussels Flower Carpet festival, a tradition dating to 1971.`,
      photoTip: `Early morning before tour groups arrive — the guildhall gilding catches the low sun well.` },
    { time: "10:15am", name: "Manneken Pis", address: "Rue de l'Étuve 31, 1000 Brussels",
      mapsUrl: gmaps(50.844993, 4.349989, "ChIJ0T1eGXnEw0cRH8GwIKZAuBc"),
      distance: "~300 m, 4 minutes", recTime: "5 minutes",
      history: `The small bronze fountain, in its current form dating to 1619 by sculptor Jérôme Duquesnoy the Elder, has become disproportionately famous relative to its size — barely 60 cm tall — replacing an earlier stone version from at least the 1450s. Several legends explain the statue, the most enduring involving a boy who supposedly extinguished a lit fuse threatening the city walls, though historians generally treat these as folklore invented well after the statue's creation.`,
      fact: `The statue owns a wardrobe of hundreds of costumes, dating back to a gift from Maximilian Emmanuel of Bavaria in 1698, changed regularly for festivals and visiting dignitaries and stored at the nearby GardeRobe MannekenPis museum.`,
      photoTip: `Go early — this tiny statue draws a surprising crowd by mid-morning.` },
    { time: "10:30am", name: "Galeries Royales Saint-Hubert", address: "Galerie du Roi 5, 1000 Brussels",
      mapsUrl: gmaps(50.8480832, 4.3552506, "ChIJu1XHbn_Ew0cRMNenwioHHhM"),
      distance: "~250 m, 3 minutes", recTime: "15 minutes",
      history: `Opened in 1847, it's considered Europe's oldest still-operating covered shopping arcade, designed by Jean-Pierre Cluysenaar to bring elegant, weatherproof shopping to the city center by replacing a dense, crime-ridden slum neighborhood — a slum-clearance and urban-renewal project that was controversial even at the time for the way it displaced poorer residents.`,
      fact: `The arcade's success inspired similar glass-roofed galleries across Europe, including Milan's Galleria Vittorio Emanuele II, built two decades later on a strikingly similar model.`,
      photoTip: `Shoot down the arcade's central axis for the full glass-vaulted ceiling.` },
    { time: "11:00am", name: "Cathedral of St. Michael and St. Gudula", address: "Esplanade de la Sainte-Gudule, 1000 Brussels",
      mapsUrl: gmaps(50.8479083, 4.3601497, "ChIJvTZ4_3_Dw0cRzSOE0556hYQ"),
      distance: "~450 m, 5 minutes", recTime: "15 minutes",
      history: `Construction spanned roughly 300 years, from the 13th to the 15th century, blending Romanesque foundations with increasingly refined Gothic styles as building techniques evolved over the generations of masons who worked on it. It has hosted royal weddings and funerals for the Belgian monarchy since the country's founding in 1830, including the funeral of nearly every Belgian king.`,
      fact: `Its twin towers, at 69 meters, were left deliberately unfinished at the top — a common medieval practice, since a shorter, thicker tower placed less structural strain on foundations that were often none too certain to begin with.`,
      photoTip: `The west façade from the esplanade, with the entrance steps in frame.`,
